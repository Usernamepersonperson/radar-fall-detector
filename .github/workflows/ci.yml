name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -p no:asyncio -q
      - name: Quick end-to-end demo (small scale, smoke test)
        run: python -m radarfall demo --quick --workers 2
      - run: python -m radarfall sim --kind backward --seed 3
